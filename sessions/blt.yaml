experim_name: 'default'
################################################################################
# training parameters
################################################################################
pretrained_root: 'checkpoints'
n_gpu: 1
root_ES: '/media/arvc/HDD4TB/Judith/MinkUNeXt-main/blt/ktima'
root_IT: '/media/data/judith/datasets/blt/ktima'

retrieval:
  top_cand: [1,5,25]
  range_thres: 6

train_loader:
  data:
    dataset: ''
    sequence: "2022-03-23-12-27-15" # ["2022-03-23-12-27-15", "2022-06-01-15-16-04", "2022-07-13-15-38-32", "2022-04-06-11-02-34", "2022-06-08-14-03-03", "2022-09-15-14-23-20", "2022-04-20-09-37-20", "2022-06-22-13-02-08", "2022-05-06", "2022-06-29-13-49-55"]
    aug: True
    modality: 'range'
    max_points: 10000
  
  ground_truth: 
    pos_range: 10 # Loop Threshold [m]
    neg_range: 15
    num_neg: 20
    num_pos: 1
    warmupitrs: 10 # Number of frames to ignore at the beguinning
    roi: 10 
    #roi: 300
    #pos_range: 5
    #neg_range: 20
  fraction: 0.3 
  batch_size: 1       # batch size
  shuffle: True
  #rotation: [180,-45,-45]
  
val_loader:
  data:
    dataset: ''
    sequence: "2022-04-06-11-02-34" # date of the sequence
    modality: 'range' # ['range',projection,bev]'intensity','density','height','bev']
    max_points: 10000

  ground_truth: 
    pos_range: 10 # Loop Threshold [m]
    neg_range: 17
    num_neg: 1
    num_pos: 50
    warmupitrs: 10 # Number of frames to ignore at the beguinning
    roi: 10 

  batch_size: 1 #50         # batch size
  workers:  0            # number of threads to get data
  shuffle: False
  #rotation: [180,-45,-45]

modelwrapper:
  type: 'ORCHNet'
  minibatch_size: 10


loss:
  type: 'TripletLoss'
  args:
    margin: 0.5
    metric: 'L2' # [L2,Hinge,cosine,kl_divergence]
    reduction: 'mean'


trainer:
  iter_per_epoch: 1
  epochs: 50
  report_val: 1      # every x epochs, report validation set
  save_period: 1
  log_dir: "saved/"
  save_dir: "checkpoints/"
  monitor: "max recall" # [off, max mIoU]
  val_per_epochs: 1
  eval_metric: 'L2'
  results_dir: "/home/judith-vilella-cantos/ORCHNet/results/blt"


optimizer:
  type: "AdamW" #[RMSprop,Adam,SGD]
  args:
    lr: 0.01
    weight_decay: 0.00000005
  lr_scheduler: "ReduceLROnPlateau"

StepLR:
  step_size: 20 
  gamma: 0.1

CosineAnnealingWarmRestarts:
  T_0: 5
  T_mult: 2
  eta_min: 0.00001 # Min learning rate

ReduceLROnPlateau:
  mode: 'min' #['min','max'] (str)
  factor: 0.01
  patience: 10 # Number of epochs with no improvement after which learning rate will be reduced. 
  min_lr: 0.000001

